                docs/source/sphinxext/github_link[.]py$
              )
          - id: verify-copyright
            name: verify-copyright-cutlass
            args: [--fix, --spdx, "--spdx-license-identifier=Apache-2.0 AND BSD-3-Clause"]
            files: |
              (?x)^(
