          - id: verify-copyright
            name: verify-copyright-faiss
            args: [--fix, --spdx, "--spdx-license-identifier=Apache-2.0 AND MIT"]
            files: |
              (?x)^(
                cpp/src/neighbors/detail/faiss_distance_utils[.]h$
              )
          - id: verify-alpha-spec
          - id: verify-codeowners
