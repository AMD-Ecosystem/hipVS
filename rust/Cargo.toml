[workspace]
members = [
    "hipvs",
    "hipvs-sys",
]
resolver = "2"

[workspace.package]
version = "2.0.0"
edition = "2024"
repository = "https://github.com/AMD-Ecosystem/hipVS"
homepage = "https://github.com/AMD-Ecosystem/hipVS"
description = "AMD HIP Vector Search library"
authors = ["NVIDIA Corporation", "Advanced Micro Devices, Inc."]
license = "MIT AND Apache-2.0"

[workspace.dependencies]
hipvs-sys = { path = "hipvs-sys", version = "2.0.0" }
