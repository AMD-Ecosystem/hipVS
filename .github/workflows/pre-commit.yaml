name: Pre-commit Checks

on:
  pull_request:
    branches:
      - amd-integration
  workflow_dispatch:

jobs:
  pre-commit:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          clean: true  # Run git clean -ffdx and git reset --hard HEAD before checkout

      - name: Cache virtual environment
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}-pre-commit
          restore-keys: |
            venv-${{ runner.os }}-

      - name: Set up virtual environment
        run: |
          if [ ! -d ".venv" ]; then
            python3 -m venv .venv
          fi
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install pre-commit

      - name: Cache pre-commit hooks
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Run pre-commit on all files
        env:
          SKIP: amd-copyright # This hook runs on all files including docs_amd/. Re-enable this once license_verificator has the ability to skip these files.
        run: |
          source .venv/bin/activate
          pre-commit run --all-files --show-diff-on-failure --color=always

      - name: Show pre-commit version
        if: always()
        run: |
          source .venv/bin/activate
          pre-commit --version
