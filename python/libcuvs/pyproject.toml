[build-system]
build-backend = "scikit_build_core.build"
requires = ["scikit-build-core[pyproject]>=0.7.0", "cmake>=3.26.4", "ninja"]

[project]
name = "libcuvs"
dynamic = ["version"]
description = "cuVS: Vector Search on the GPU (C++)"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
    { name = "Advanced Micro Devices, Inc." },
    { name = "NVIDIA Corporation" },
]
license = { text = "Apache 2.0 AND MIT" }
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Intended Audience :: Developers",
]

[project.urls]
Homepage = "https://github.com/rapidsai/cuvs"
Documentation = "https://docs.rapids.ai/api/cuvs/stable/"

[project.entry-points."cmake.prefix"]
libcuvs = "libcuvs"

[tool.isort]
line_length = 79
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
combine_as_imports = true
order_by_type = true
known_first_party = [
    "libcuvs",
]
skip = [
    "thirdparty",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".tox",
    ".venv",
    "_build",
    "buck-out",
    "build",
    "dist",
    "__init__.py",
]

[tool.scikit-build]
build-dir = "build/{wheel_tag}"
cmake.build-type = "Release"
cmake.version = "CMakeLists.txt"
minimum-version = "build-system.requires"
ninja.make-fallback = true
sdist.reproducible = true
wheel.install-dir = "libcuvs"
wheel.packages = ["libcuvs"]
wheel.py-api = "py3"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "libcuvs/VERSION"
regex = "(?P<value>.*)"

[tool.pydistcheck]
select = [
    "distro-too-large-compressed",
]

# detect when package size grows significantly
max_allowed_size_compressed = '1.2G'
