[build-system]

build-backend = "scikit_build_core.build"
requires = [
    "cython>=3.0.0,<3.1.0a0",
    "scikit-build-core[pyproject]>=0.11.0",
    "amd-hipmm",
    "amd-libhipmm",
]

[project]
name = "amd-hipvs"
dynamic = ["version"]
description = "hipVS: Vector Search on the GPU"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
    { name = "Advanced Micro Devices, Inc." },
    { name = "NVIDIA Corporation" },
]
license = { text = "Apache-2.0 AND MIT" }
requires-python = ">=3.11"
dependencies = [
# <<<<<<< OLD CODE from 643ea2d63 (84b92c31c) - COMMENTED OUT
#     "amd-libhipvs==2.0.*",
#     "numpy>=1.23,<3.0",
#     "amd_hipmm~=5.0",
#     # NOTE(HIP/AMD): AMD substitutes upstream `cuda-python` with the AMD pair
#     # `rocm-bindings-hip` + `hip-python-interop` (the latter exposes a `cuda.*`
#     # namespace backed by HIP).
#     "hip-python-interop>=7.2.3",
#     "rocm-bindings-hip>=7.2.3",
#     "amd-libraft==2.0.*",
#     "amd-pylibraft==2.0.*",
# ]
# =======
    "cuda-python>=13.0.1,<14.0",
    "libcuvs==26.6.*,>=0.0.0a0",
    "numpy>=1.23,<3.0",
    "pylibraft==26.6.*,>=0.0.0a0",
] # This list was generated by `rapids-dependency-file-generator`. To make changes, edit ../../dependencies.yaml and run `rapids-dependency-file-generator`.
# >>>>>>> END NEW CODE (84b92c31c)
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
test = [
    "amd-cupy",
    "pytest",
    "pytest-cov",
    "pytest<9.0.0",
    "scikit-learn>=1.5",
]

[project.urls]
Homepage = "https://github.com/ROCm-DS/hipVS"
Documentation = "https://rocm.docs.amd.com/projects/hipVS/en/latest/"
"Issue Tracker" = "https://github.com/ROCm-DS/hipVS/issues"

[tool.isort]
line_length = 79
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
combine_as_imports = true
order_by_type = true
known_dask = [
    "dask",
    "distributed",
    "dask_cuda",
]
known_rapids = [
    "rmm",
]
known_first_party = [
    "cuvs",
]
default_section = "THIRDPARTY"
sections = [
    "FUTURE",
    "STDLIB",
    "THIRDPARTY",
    "DASK",
    "RAPIDS",
    "FIRSTPARTY",
    "LOCALFOLDER",
]
skip = [
    "thirdparty",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".tox",
    ".venv",
    "_build",
    "buck-out",
    "build",
    "dist",
    "__init__.py",
]

[tool.scikit-build]
build-dir = "build/{wheel_tag}"
cmake.build-type = "Release"
cmake.version = "CMakeLists.txt"
cmake.args = ["-DCMAKE_CXX_COMPILER=hipcc"]
minimum-version = "build-system.requires"
ninja.make-fallback = true
sdist.reproducible = true
wheel.packages = ["cuvs"]
wheel.py-api = "cp311" # overridden in CI builds by arguments from `ci/build_wheel_*.sh` scripts.

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "cuvs/VERSION"
regex = "(?P<value>.*)"

# <<<<<<< OLD CODE from 643ea2d63 (84b92c31c) - COMMENTED OUT
# =======
[tool.rapids-build-backend]
requires = [
    "cmake>=3.30.4",
    "cuda-python>=13.0.1,<14.0",
    "cython>=3.2.2",
    "libcuvs==26.6.*,>=0.0.0a0",
    "libraft==26.6.*,>=0.0.0a0",
    "librmm==26.6.*,>=0.0.0a0",
    "ninja",
] # This list was generated by `rapids-dependency-file-generator`. To make changes, edit ../../dependencies.yaml and run `rapids-dependency-file-generator`.
build-backend = "scikit_build_core.build"
dependencies-file = "../../dependencies.yaml"
matrix-entry = "cuda_suffixed=true"

# >>>>>>> END NEW CODE (84b92c31c)
[tool.pydistcheck]
select = [
    "distro-too-large-compressed",
]

# PyPI hard limit is 1GiB, but try to keep this as small as possible
max_allowed_size_compressed = '15Mi'

[tool.pytest.ini_options]
filterwarnings = [
    "error",
    "ignore:.*cuda..* module is deprecated.*:DeprecationWarning"
]
