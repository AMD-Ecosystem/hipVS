[build-system]

build-backend = "scikit_build_core.build"
requires = [
    "cython>=3.0.0,<3.1.0a0",
    "scikit-build-core[pyproject]>=0.10.0",
    "amd-hipmm",
    "amd-libhipmm",
]

[project]
name = "amd-hipvs"
dynamic = ["version"]
description = "hipVS: Vector Search on the GPU"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
    { name = "Advanced Micro Devices, Inc." },
    { name = "NVIDIA Corporation" },
]
license = { text = "Apache-2.0 AND MIT" }
requires-python = ">=3.10"
dependencies = [
# <<<<<<< OLD CODE from a2088ef68 (57bc73d77) - COMMENTED OUT
#     "amd-libhipvs==1.0.*",
#     "numpy>=1.23,<3.0a0",
#     "amd_hipmm~=4.0",
#     "hip-python",
#     "hip-python-as-cuda",
#     "amd-libraft==1.0.*",
#     "amd-pylibraft==1.0.*",
# ]
# =======
    "cuda-python>=13.0.1,<14.0a0",
    "libcuvs==25.12.*,>=0.0.0a0",
    "numpy>=1.23,<3.0a0",
    "pylibraft==25.12.*,>=0.0.0a0",
] # This list was generated by `rapids-dependency-file-generator`. To make changes, edit ../../dependencies.yaml and run `rapids-dependency-file-generator`.
# >>>>>>> END NEW CODE (57bc73d77)
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
test = [
# <<<<<<< OLD CODE from 5f2a3ad5e (d7f7532f9) - COMMENTED OUT
#     "amd-cupy",
#     "pytest",
# =======
    "cupy-cuda13x>=13.6.0",
# >>>>>>> END NEW CODE (d7f7532f9)
    "pytest-cov",
    "pytest<9.0.0a0",
    "scikit-learn",
]

[project.urls]
Homepage = "https://github.com/ROCm-DS/hipVS"
Documentation = "https://rocm.docs.amd.com/projects/hipVS/en/latest/"
"Issue Tracker" = "https://github.com/ROCm-DS/hipVS/issues"

[tool.isort]
line_length = 79
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
combine_as_imports = true
order_by_type = true
known_dask = [
    "dask",
    "distributed",
    "dask_cuda",
]
known_rapids = [
    "rmm",
]
known_first_party = [
    "cuvs",
]
default_section = "THIRDPARTY"
sections = [
    "FUTURE",
    "STDLIB",
    "THIRDPARTY",
    "DASK",
    "RAPIDS",
    "FIRSTPARTY",
    "LOCALFOLDER",
]
skip = [
    "thirdparty",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".tox",
    ".venv",
    "_build",
    "buck-out",
    "build",
    "dist",
    "__init__.py",
]

[tool.scikit-build]
build-dir = "build/{wheel_tag}"
cmake.build-type = "Release"
cmake.version = "CMakeLists.txt"
cmake.args = ["-DCMAKE_CXX_COMPILER=hipcc"]
minimum-version = "build-system.requires"
ninja.make-fallback = true
sdist.reproducible = true
wheel.packages = ["cuvs"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "cuvs/VERSION"
regex = "(?P<value>.*)"
# <<<<<<< OLD CODE from a2088ef68 (57bc73d77) - COMMENTED OUT
# =======

[tool.rapids-build-backend]
requires = [
    "cmake>=3.30.4",
    "cuda-python>=13.0.1,<14.0a0",
    "cython>=3.0.0,<3.2.0a0",
    "libcuvs==25.12.*,>=0.0.0a0",
    "libraft==25.12.*,>=0.0.0a0",
    "librmm==25.12.*,>=0.0.0a0",
    "ninja",
] # This list was generated by `rapids-dependency-file-generator`. To make changes, edit ../../dependencies.yaml and run `rapids-dependency-file-generator`.
build-backend = "scikit_build_core.build"
dependencies-file = "../../dependencies.yaml"
matrix-entry = "cuda_suffixed=true"

# >>>>>>> END NEW CODE (57bc73d77)
[tool.pydistcheck]
select = [
    "distro-too-large-compressed",
]

# PyPI limit is 100 MiB, fail CI before we get too close to that
max_allowed_size_compressed = '75M'

[tool.pytest.ini_options]
filterwarnings = [
    "error",
    "ignore:.*cuda..* module is deprecated.*:DeprecationWarning"
]
