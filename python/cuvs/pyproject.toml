[build-system]

build-backend = "scikit_build_core.build"
requires = [
    "cython>=3.0.0,<3.1.0a0",
    "scikit-build-core[pyproject]>=0.10.0",
    "amd-hipmm",
    "amd-libhipmm",
]

[project]
name = "amd-hipvs"
dynamic = ["version"]
description = "hipVS: Vector Search on the GPU"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
    { name = "Advanced Micro Devices, Inc." },
    { name = "NVIDIA Corporation" },
]
license = { text = "Apache-2.0 AND MIT" }
requires-python = ">=3.10"
dependencies = [
    "amd-libhipvs==1.0.*",
    "numpy>=1.23,<3.0a0",
    "amd_hipmm~=4.0",
    "hip-python",
    "hip-python-as-cuda",
    "amd-libraft==1.0.*",
    "amd-pylibraft==1.0.*",
]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
test = [
    "amd-cupy",
    "pytest",
    "pytest-cov",
    "scikit-learn",
]

[project.urls]
Homepage = "https://github.com/rapidsai/cuvs"
Documentation = "https://docs.rapids.ai/api/cuvs/stable/"

[tool.isort]
line_length = 79
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
combine_as_imports = true
order_by_type = true
known_dask = [
    "dask",
    "distributed",
    "dask_cuda",
]
known_rapids = [
    "rmm",
]
known_first_party = [
    "cuvs",
]
default_section = "THIRDPARTY"
sections = [
    "FUTURE",
    "STDLIB",
    "THIRDPARTY",
    "DASK",
    "RAPIDS",
    "FIRSTPARTY",
    "LOCALFOLDER",
]
skip = [
    "thirdparty",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".tox",
    ".venv",
    "_build",
    "buck-out",
    "build",
    "dist",
    "__init__.py",
]

[tool.scikit-build]
build-dir = "build/{wheel_tag}"
cmake.build-type = "Release"
cmake.version = "CMakeLists.txt"
cmake.args = ["-DCMAKE_CXX_COMPILER=hipcc"]
minimum-version = "build-system.requires"
ninja.make-fallback = true
sdist.reproducible = true
wheel.packages = ["cuvs"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "cuvs/VERSION"
regex = "(?P<value>.*)"
[tool.pydistcheck]
select = [
    "distro-too-large-compressed",
]

# PyPI limit is 100 MiB, fail CI before we get too close to that
max_allowed_size_compressed = '75M'

[tool.pytest.ini_options]
filterwarnings = [
    "error",
    "ignore:.*cuda..* module is deprecated.*:DeprecationWarning"
]
